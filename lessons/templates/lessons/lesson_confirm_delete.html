{% extends 'base.html' %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'lessons/css/lesson_confirm_delete.css' %}">

<section class="lesson-delete-container">
  <div class="delete-card">
    <h2 class="delete-title">Видалення уроку</h2>
    <p>Ви впевнені, що хочете видалити урок <strong>"{{ lesson.title }}"</strong>?</p>    

    <form method="post" class="delete-form">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">🗑️ Так, видалити</button>
      <a href="{% url 'lesson_detail' lesson.course.id lesson.id %}" class="btn btn-secondary">⬅ Скасувати</a>
    </form>
  </div>
</section>
{% endblock %}
