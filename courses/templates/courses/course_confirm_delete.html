{% extends 'base.html' %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'courses/css/course_confirm_delete.css' %}">

<section class="course-delete-container">
  <div class="delete-card">
    <h2 class="delete-title">Видалення курсу</h2>
    <p>Ви впевнені, що хочете видалити курс <strong>"{{ course.name }}"</strong>?</p>    

    <form method="post" class="delete-form">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">🗑️ Так, видалити</button>
      <a href="{% url 'course_detail' course.id %}" class="btn btn-secondary">⬅ Скасувати</a>
    </form>
  </div>
</section>
{% endblock %}
